name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap and fast, and the only job that can run without a Mac. Catches bracket
  # balance, unknown types, bad member references, import policy violations, the
  # read-only banned-API rules, and project.yml paths that no longer exist.
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Run swiftcheck
        run: python3 Tools/swiftcheck.py Sources Tests App

      # The release workflow is run by hand, months apart, and a broken one is
      # discovered by a failed TestFlight upload rather than by CI. actionlint
      # checks the workflows themselves — expressions, contexts, action inputs —
      # and shellcheck checks the bash inside every `run:` block, which is where
      # the release workflow does its real work.
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # Published alongside the release. Pinning the hash as well as the
          # version means a retagged or substituted asset fails the job rather
          # than running as root in CI.
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          pip install --quiet shellcheck-py

          # Downloaded outside the checkout, so the tool does not appear as an
          # untracked file in the tree it is checking.
          tools="$(mktemp -d)"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tools/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $tools/$archive" | sha256sum --check --status \
            || { echo "::error::actionlint checksum mismatch"; exit 1; }
          tar xzf "$tools/$archive" -C "$tools" actionlint

          # Run from the repository root with no file arguments: actionlint finds
          # .github/workflows itself, so a workflow added later is covered without
          # editing this step.
          "$tools/actionlint" -shellcheck "$(command -v shellcheck)"

  # The important one: this is where DriveLayerCore is actually compiled and the
  # test suite actually runs. The core is Foundation-only precisely so this job
  # needs no Xcode project, no simulator and no code signing.
  core-tests:
    name: Core tests (swift test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --parallel

  # Runs the tests that `swift test` cannot: the stores, the services and the
  # coordinator, which need SwiftData, CoreLocation, CoreMotion and friends. This is
  # the job that covers the layer where the reliability bugs actually were.
  app-tests:
    name: App tests (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        # Chosen at run time rather than hard-coded: the runner image's simulator
        # list changes with every Xcode update, and a pinned device name is a build
        # that breaks on someone else's schedule.
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, entries in devices.items():
              if 'iOS' not in runtime:
                  continue
              for entry in entries:
                  if 'iPhone' in entry.get('name', ''):
                      print(entry['udid'])
                      sys.exit(0)
          sys.exit('no iPhone simulator available')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test -quiet \
            -project DriveLayer.xcodeproj \
            -scheme DriveLayer \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:DriveLayerAppTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  # Compiles the app and the widget extension for the simulator. Code signing is
  # disabled because CI has no team and does not need one to prove it builds.
  app-build:
    name: App build (iOS Simulator)
    # macos-15 carries an Xcode new enough to open the project format current
    # XcodeGen emits. On macos-14 the generated project is rejected as "a future
    # Xcode project file format".
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -quiet \
            -project DriveLayer.xcodeproj \
            -scheme DriveLayer \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
