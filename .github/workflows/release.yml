name: TestFlight

# Archives DriveLayer, signs it, and uploads it to TestFlight.
#
# Run it by hand from the Actions tab. It is deliberately not automatic: every
# upload consumes a build number and notifies testers, and neither should happen
# because someone merged a README change.
#
# Everything Apple-specific comes from repository secrets. Nothing about the
# developer account is committed — no team ID, no certificate, no key. See
# docs/RELEASE.md for how to produce each one.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number. Leave empty to use the workflow run number."
        required: false
        type: string

jobs:
  testflight:
    name: Archive and upload
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Check the required secrets are present
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Fail here with a readable list rather than forty lines into xcodebuild.
          #
          # Report the name of the *secret* to create, not the variable it lands in.
          # Someone reading this error is looking at the "New secret" page, where a
          # name like CERT does not exist and cannot be acted on.
          missing=""
          require() {  # $1 = env var to test, $2 = the repository secret that fills it
            if [ -z "${!1}" ]; then missing="$missing $2"; fi
          }
          require TEAM_ID       APPLE_TEAM_ID
          require CERT          BUILD_CERTIFICATE_BASE64
          require CERT_PASSWORD P12_PASSWORD
          require KEY_ID        APP_STORE_CONNECT_KEY_ID
          require ISSUER_ID     APP_STORE_CONNECT_ISSUER_ID
          require PRIVATE_KEY   APP_STORE_CONNECT_PRIVATE_KEY
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "See docs/RELEASE.md for how to create each one."
            exit 1
          fi

      - name: Check the certificate and key are usable
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Never add `set -x` to this step. It handles a signing key, and tracing would
          # print it into a log every collaborator can read.

          P12="$RUNNER_TEMP/preflight.p12"
          trap 'rm -f "$P12"' EXIT

          fail() { echo "::error::$1"; shift; for line in "$@"; do echo "  $line"; done; exit 1; }

          if ! printf '%s' "$CERT" | base64 --decode > "$P12" 2>/dev/null || [ ! -s "$P12" ]; then
            fail "BUILD_CERTIFICATE_BASE64 is not valid base64." \
                 "Re-run the base64 step and paste the whole file. See docs/RELEASE.md A4."
          fi

          # Opening the container proves the password matches and the file is really a .p12.
          if ! openssl pkcs12 -in "$P12" -passin env:CERT_PASSWORD -nokeys -clcerts -noout 2>/dev/null; then
            fail "The certificate could not be opened." \
                 "Either P12_PASSWORD does not match, or BUILD_CERTIFICATE_BASE64 is not a .p12." \
                 "If you built it with OpenSSL 3, see the -legacy note in docs/RELEASE.md Appendix A."
          fi

          # The key is counted while still encrypted, so it is never written in the clear.
          keys="$(openssl pkcs12 -in "$P12" -passin env:CERT_PASSWORD -nocerts -passout pass:preflight 2>/dev/null \
                  | grep -c 'BEGIN ENCRYPTED PRIVATE KEY' || true)"
          if [ "${keys:-0}" -lt 1 ]; then
            fail "The certificate has no private key in it." \
                 "A .p12 exported without its key signs nothing. In Keychain Access, select the" \
                 "certificate AND the key under it before exporting; with OpenSSL, pass -inkey." \
                 "See docs/RELEASE.md Appendix A3."
          fi

          CERT_PEM="$RUNNER_TEMP/preflight.pem"
          openssl pkcs12 -in "$P12" -passin env:CERT_PASSWORD -nokeys -clcerts 2>/dev/null > "$CERT_PEM"
          subject="$(openssl x509 -in "$CERT_PEM" -noout -subject 2>/dev/null || true)"

          case "$subject" in
            *"Apple Distribution"*|*"iPhone Distribution"*)
              echo "Certificate: distribution, good." ;;
            *"Apple Development"*|*"iPhone Developer"*)
              rm -f "$CERT_PEM"
              fail "This is a development certificate, not a distribution one." \
                   "It imports fine and then fails much later, during export, where it looks" \
                   "like an export bug. Create an Apple Distribution certificate instead." \
                   "See docs/RELEASE.md Appendix A2." ;;
            *)
              echo "::warning::Could not tell whether this is a distribution certificate." ;;
          esac

          if ! openssl x509 -in "$CERT_PEM" -checkend 0 -noout >/dev/null 2>&1; then
            expiry="$(openssl x509 -in "$CERT_PEM" -noout -enddate 2>/dev/null | cut -d= -f2)"
            rm -f "$CERT_PEM"
            fail "The signing certificate expired on ${expiry:-an earlier date}." \
                 "Apple will reject the upload. Issue a new distribution certificate and" \
                 "replace BUILD_CERTIFICATE_BASE64."
          fi
          rm -f "$CERT_PEM"

          case "$PRIVATE_KEY" in
            *"BEGIN PRIVATE KEY"*) ;;
            *) fail "APP_STORE_CONNECT_PRIVATE_KEY does not look like a .p8 key." \
                    "Paste the whole downloaded file, including the BEGIN and END lines." ;;
          esac

          echo "Preflight passed: certificate opens, carries its key, is a distribution"
          echo "certificate, has not expired, and the App Store Connect key is well formed."

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Import the signing certificate
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          # A throwaway keychain, unlocked only for this job. The runner is
          # destroyed afterwards, but a keychain scoped to the job is still the
          # right habit: nothing else on the machine can read the key.
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo -n "$CERT" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm "$RUNNER_TEMP/certificate.p12"

      - name: Write the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # xcodebuild reads the key from a path; altool reads it from this
          # well-known directory. Both get a copy.
          mkdir -p "$RUNNER_TEMP/private_keys" ~/.appstoreconnect/private_keys
          printf '%s' "$PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"
          cp "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
             ~/.appstoreconnect/private_keys/"AuthKey_${KEY_ID}.p8"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: |
          set -o pipefail
          # -allowProvisioningUpdates with an API key lets Xcode create and fetch
          # the profiles for both the app and the widget extension, so no
          # provisioning profile has to be stored as a secret and kept in step.
          # project.yml sets CODE_SIGN_STYLE: Automatic for local, IDE-driven
          # development builds. It does not follow that xcodebuild picks a
          # distribution identity for a Release archive on its own - two real
          # runs confirmed Automatic alone resolves to Development every time,
          # regardless of -configuration. A third real run then confirmed that
          # naming the identity while still under Automatic does not steer that
          # resolution either - Xcode calls it a conflict and says outright what
          # it wants instead: "Set the code signing identity value to Apple
          # Development... or switch to manual signing." Overriding
          # CODE_SIGN_STYLE to Manual here is that switch, scoped to this one
          # invocation, so the identity we supply is trusted rather than
          # fought. No PROVISIONING_PROFILE_SPECIFIER is set on purpose:
          # -allowProvisioningUpdates covers profile creation under manual
          # signing too, which is the entire reason it takes an API key.
          xcodebuild archive \
            -project DriveLayer.xcodeproj \
            -scheme DriveLayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DriveLayer.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export the IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          # The team ID is the one value ExportOptions.plist cannot carry, since
          # it must not be committed.
          /usr/libexec/PlistBuddy -c "Delete :teamID" Config/ExportOptions.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" Config/ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DriveLayer.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)"
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa was produced by the export step."
            exit 1
          fi
          echo "Uploading $(basename "$IPA")"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Keep the IPA and the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drivelayer-ipa
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/export/*.plist
          if-no-files-found: ignore
          retention-days: 14

      - name: Say what happens next
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Uploaded to App Store Connect

          Processing usually takes 5-15 minutes. The build appears in TestFlight
          once it finishes, and internal testers can install it immediately after
          that — no review needed.

          CarPlay will **not** work in this build unless Apple has granted the
          driving-task entitlement and docs/CARPLAY.md's two edits are applied.
          The phone app is unaffected.
          SUMMARY
